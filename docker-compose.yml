include:
  # WeKnora and its dependencies (PostgreSQL, Redis, DocReader)
  # Variable substitution uses WeKnora/.env
  - path: WeKnora/docker-compose.yml
    env_file: WeKnora/.env

services:
  clawith-postgres:
    image: postgres:15.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clawith}
      POSTGRES_DB: ${POSTGRES_DB:-clawith}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clawith}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laboflow

  clawith-redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laboflow

  clawith-backend:
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-clawith-backend:${TAG:-1.0}
    privileged: true
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    sysctls:
      net.ipv4.tcp_keepalive_time: 120
      net.ipv4.tcp_keepalive_intvl: 30
      net.ipv4.tcp_keepalive_probes: 3
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clawith}:${POSTGRES_PASSWORD:-clawith}@clawith-postgres:5432/${POSTGRES_DB:-clawith}
      REDIS_URL: redis://clawith-redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: '["*"]'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3008}
      WEKNORA_URL: ${WEKNORA_URL:-/kb}
      DOCKER_NETWORK: laboflow
    volumes:
      - agent_data:/data/agents
    depends_on:
      clawith-postgres:
        condition: service_healthy
      clawith-redis:
        condition: service_healthy
    networks:
      laboflow:
        aliases:
          - backend

  clawith-frontend:
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-clawith-frontend:${TAG:-1.0}
    restart: unless-stopped
    depends_on:
      - clawith-backend
    networks:
      - laboflow

  pro-slides:
    build:
      context: "./Pro Slides"
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-pro-slides:${TAG:-1.0}
    ports:
      - "7456"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PPT_AGENT_ID=${PPT_AGENT_ID:-}
      - NEXT_PUBLIC_PPT_AGENT_ID=${PPT_AGENT_ID:-}
      - PORT=7456
    labels:
      - "traefik.enable=false"
    networks:
      - laboflow

  # ── PPT-Master DB (postgres pulled from Docker Hub) ───────
  pptmaster-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PPTMASTER_POSTGRES_USER:-pptmaster}
      POSTGRES_PASSWORD: ${PPTMASTER_POSTGRES_PASSWORD:-pptmaster}
      POSTGRES_DB: ${PPTMASTER_POSTGRES_DB:-pptmaster}
    volumes:
      - pptmaster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PPTMASTER_POSTGRES_USER:-pptmaster}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - laboflow

  # ── PPT-Master PPTX converter (gotenberg pulled from Docker Hub) ──
  pptmaster-converter:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --api-port=3000
      - --api-timeout=300s
      - --libreoffice-restart-after=10
    networks:
      - laboflow

  # ── PPT-Master one-shot init (alembic + bootstrap admin) ──
  pptmaster-init:
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-pptmaster-worker:${TAG:-1.0}
    restart: "no"
    command: >
      bash -c "alembic upgrade head && python -m pptmaster.bootstrap"
    environment:
      DATABASE_URL: postgresql+asyncpg://${PPTMASTER_POSTGRES_USER:-pptmaster}:${PPTMASTER_POSTGRES_PASSWORD:-pptmaster}@pptmaster-postgres:5432/${PPTMASTER_POSTGRES_DB:-pptmaster}
      SYSTEM_AES_KEY: ${SYSTEM_AES_KEY:-}
      INITIAL_ADMIN_EMAIL: ${PPTMASTER_INITIAL_ADMIN_EMAIL:-admin@local.dev}
      INITIAL_ADMIN_PASSWORD: ${PPTMASTER_INITIAL_ADMIN_PASSWORD:-change-me}
      DEPLOYMENT_MODE: standalone
    volumes:
      - pptmaster_project_data:/data
    depends_on:
      pptmaster-postgres:
        condition: service_healthy
    networks:
      - laboflow

  # ── PPT-Master worker (FastAPI + LangGraph + skill bundle) ──
  pptmaster-worker:
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-pptmaster-worker:${TAG:-1.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PPTMASTER_POSTGRES_USER:-pptmaster}:${PPTMASTER_POSTGRES_PASSWORD:-pptmaster}@pptmaster-postgres:5432/${PPTMASTER_POSTGRES_DB:-pptmaster}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      JWT_ALGORITHM: HS256
      JWT_EXP_MINUTES: 1440
      SYSTEM_AES_KEY: ${SYSTEM_AES_KEY:-}
      PPTMASTER_SSO_AUDIENCE: ${PPTMASTER_SSO_AUDIENCE:-ppt-master}
      DEPLOYMENT_MODE: standalone
      STORAGE_BACKEND: volume
      STORAGE_ROOT: /data
      PPTMASTER_CONVERTER_URL: http://pptmaster-converter:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3008}
      PPTMASTER_SCRIPTS_DIR: /opt/pptmaster-skill/scripts
      PPTMASTER_TEMPLATES_DIR: /opt/pptmaster-skill/templates
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - pptmaster_project_data:/data
    depends_on:
      pptmaster-postgres:
        condition: service_healthy
      pptmaster-converter:
        condition: service_started
      pptmaster-init:
        condition: service_completed_successfully
    networks:
      laboflow:
        aliases:
          - pptmaster-worker

  # ── PPT-Master webui (nginx static SPA) ──
  pptmaster-webui:
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-pptmaster-webui:${TAG:-1.0}
    restart: unless-stopped
    depends_on:
      - pptmaster-worker
    networks:
      - laboflow

  # Override WeKnora images to use LaboFlow registry tags.
  app:
    build:
      context: ./WeKnora
      dockerfile: docker/Dockerfile.app
      args:
        - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-weknora-app:${TAG:-1.0}
    environment:
      # SSO: must match Clawith's JWT_SECRET_KEY
      JWT_SECRET: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      # AES key for encrypting sensitive fields (api_key, app secrets, etc.)
      # Generate with: openssl rand -base64 32 | cut -c1-32
      SYSTEM_AES_KEY: ${SYSTEM_AES_KEY:-}

  docreader:
    build:
      context: ./WeKnora
      dockerfile: docker/Dockerfile.docreader
      args:
        - APT_MIRROR=${APT_MIRROR:-}
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-weknora-docreader:${TAG:-1.0}

  # Override WeKnora's frontend with LaboFlow custom build (/kb/ base path).
  # Same service name as the included WeKnora/docker-compose.yml so it takes
  # precedence and avoids port conflicts.
  frontend:
    build:
      context: ./WeKnora/frontend
      dockerfile: Dockerfile.laboflow
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-weknora-frontend:${TAG:-1.0}
    container_name: WeKnora-frontend
    ports:
      - "${WEKNORA_FRONTEND_PORT:-8800}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - APP_HOST=${APP_HOST:-app}
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - WeKnora-network
    restart: unless-stopped

  # MinerU self-hosted document parser (better quality than default docreader)
  mineru:
    image: opendatalab/mineru:latest
    container_name: WeKnora-mineru
    ports:
      - "${MINERU_PORT:-9930}:9930"
    restart: unless-stopped
    networks:
      - WeKnora-network
    profiles:
      - mineru
      - full

  nginx:
    image: ${REGISTRY:-crpi-oxztsn6qggvtnlnf.cn-guangzhou.personal.cr.aliyuncs.com/laboflow}/docker-nginx:${TAG:-1.0}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-3008}:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - clawith-frontend
      - clawith-backend
      - frontend
      - pro-slides
    networks:
      - laboflow
      - WeKnora-network  # must reach frontend (WeKnora) on its own network

volumes:
  pgdata:
  redisdata:
  agent_data:
  pptmaster_pg_data:
  pptmaster_project_data:

networks:
  laboflow:
    driver: bridge
  # WeKnora-network is declared in WeKnora/docker-compose.yml (via include);
  # nginx joins it below to reach frontend (WeKnora) by service name — do not re-declare here.
