<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="pi-plugin-chrome" content="v2">
<title>PPT 工作台</title>
<style>
  :root {
    color-scheme: light dark;
    /* Panel pages receive no --pi-* tokens from the host: without these, dark
       mode painted #1f2328 text on the #181818 window background. Keep --pi-bg
       equal to builtinWindowBackground so the titlebar sample matches. */
    --pi-bg: #ffffff;
    --pi-fg: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root { --pi-bg: #181818; --pi-fg: #e6e8eb; }
  }
  .confirm-error {
    color: #d1242f; font-size: 12px; margin-top: 6px;
    white-space: pre-wrap; word-break: break-word;
  }
  .confirm-actions { margin-top: 8px; }
  .confirm-actions button.primary { background: #2da44e; border-color: #2da44e; color: #fff; font-weight: 600; }
  .confirm-actions button.primary:disabled { opacity: .45; }
  .confirm-actions input.hidden { display: none; }
  .confirm-stage-head { font-weight: 600; margin-bottom: 4px; }
  .confirm-subcard { margin: 6px 0 0 12px; padding: 6px 10px; border-left: 2px solid color-mix(in srgb, currentColor 25%, transparent); }
  .keyline { display: flex; gap: 6px; align-items: baseline; }
  .keyline .k { color: inherit; opacity: .55; flex-shrink: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: calc(var(--pi-plugin-titlebar-height, 0px) + 12px) 14px 14px;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--pi-fg, #1f2328); background: var(--pi-bg, transparent);
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin: 16px 0 6px; }
  .card { border: 1px solid color-mix(in srgb, currentColor 16%, transparent); border-radius: 10px; padding: 10px 12px; margin: 6px 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { opacity: .6; font-size: 12px; }
  button { font: inherit; padding: 5px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: transparent; color: inherit; }
  button:disabled { opacity: .45; cursor: default; }
  input[type="text"] { font: inherit; padding: 5px 8px; border-radius: 8px; flex: 1; min-width: 200px;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: transparent; color: inherit; }
  .stage { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .stage .name { min-width: 86px; font-weight: 600; }
  .badge { padding: 1px 9px; border-radius: 999px; font-size: 11px;
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent); white-space: nowrap; }
  .badge.confirmed, .badge.succeeded, .badge.ready { background: color-mix(in srgb, currentColor 82%, transparent); color: var(--pi-bg, #fff); }
  .badge.submitted, .badge.running { background: color-mix(in srgb, currentColor 16%, transparent); }
  .badge.waived { opacity: .7; }
  #preview { width: 100%; aspect-ratio: 16 / 9; border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
    border-radius: 10px; background: color-mix(in srgb, currentColor 5%, transparent); display: flex;
    align-items: center; justify-content: center; overflow: hidden; }
  #preview svg { width: 100%; height: 100%; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  /* FR-PPT-04/18: outline tree — page list with per-page actions. */
  #outline { display: flex; gap: 10px; align-items: flex-start; }
  #page-list { min-width: 180px; max-height: 340px; overflow: auto; border: 1px solid color-mix(in srgb, currentColor 16%, transparent); border-radius: 10px; padding: 4px; }
  .page-item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .page-item:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .page-item.sel { background: color-mix(in srgb, currentColor 14%, transparent); font-weight: 600; }
  .page-item .acts { margin-left: auto; display: none; gap: 2px; }
  .page-item:hover .acts { display: inline-flex; }
  .page-item .acts button { padding: 0 5px; font-size: 11px; border: 0; background: none; cursor: pointer; color: inherit; opacity: .65; }
  .page-item .acts button:hover { opacity: 1; }
  #preview-body { flex: 1; min-width: 0; }
  .filelist { font-size: 12px; }
  .filelist .f { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .linkish { text-decoration: underline; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1 id="t-title"></h1>

<h2 id="t-runtime"></h2>
<div class="card row">
  <span class="badge" id="rt-stage">…</span>
  <span class="muted" id="rt-diag"></span>
  <span style="flex:1"></span>
  <button id="btn-setup"></button>
  <button id="btn-refresh"></button>
</div>

<h2 id="t-pipeline"></h2>
<div class="row">
  <input type="text" id="project-dir" placeholder="projects/<name>_<date> 项目目录（绝对路径）">
  <button id="btn-load"></button>
</div>
<div class="card hidden" id="pipeline"></div>

<h2 id="t-pages"></h2>
<div id="outline">
  <div id="page-list" class="muted">载入项目后显示页面列表</div>
  <div id="preview-body">
<div id="preview"><span class="muted" id="preview-empty"></span></div>
<div class="pager hidden" id="pager">
  <button id="pg-prev">←</button>
  <span class="muted" id="pg-label">0 / 0</span>
  <button id="pg-next">→</button>
  <span class="muted" id="pg-placeholder"></span>
</div>
  </div>
</div>
<div class="muted" style="margin-top:4px">悬停页面条目：↻ 重生成 · ✕ 删除（入 backup）· ✎ 重命名（NN_ 前缀即页序）。页操作使 final 质检报告失效，导出前需重跑。</div>

<h2 id="t-exports"></h2>
<div class="card filelist hidden" id="exports"></div>
<div class="card filelist hidden" id="backups"></div>

<h2 id="t-confirm-section" class="hidden"></h2>
<div class="card hidden" id="confirm-section">
  <div id="confirm-body"></div>
  <div id="confirm-error" class="confirm-error hidden"></div>
  <div class="row confirm-actions">
    <input type="text" id="confirm-reason" class="hidden">
    <button id="btn-confirm-stage" class="primary"></button>
    <button id="btn-waive-stage"></button>
  </div>
</div>

<script>
const bridge = window.pluginBridge;

// 8 locales matching packages/i18n (en is the source of truth).
const T = {
  "zh-CN": { title: "PPT 工作台", runtime: "运行时", pipeline: "管线", pages: "翻页预览", exports: "导出",
    setup: "安装", refresh: "刷新", load: "载入", projectPh: "projects/<name>_<date> 项目目录（绝对路径）",
    emptyPages: "载入项目后显示 svg_output 页面", noExports: "暂无导出",
    confirmSection: "设计确认", stage1: "Stage-1 · 沟通契约与模板选择", stage2: "Stage-2 · 最终设计方向（三选一）",
    confirm: "确认方案", quick: "快速模式（跳过确认）", reason: "填写跳过原因（必填）",
    needReason: "请先填写跳过原因。", confirmed: "已确认。等待智能体继续……" },
  "zh-TW": { title: "PPT 工作台", runtime: "執行環境", pipeline: "管線", pages: "翻頁預覽", exports: "匯出",
    setup: "安裝", refresh: "重新整理", load: "載入", projectPh: "projects/<name>_<date> 專案目錄（絕對路徑）",
    emptyPages: "載入專案後顯示 svg_output 頁面", noExports: "暫無匯出",
    confirmSection: "設計確認", stage1: "Stage-1 · 溝通契約與範本選擇", stage2: "Stage-2 · 最終設計方向（三選一）",
    confirm: "確認方案", quick: "快速模式（跳過確認）", reason: "填寫跳過原因（必填）",
    needReason: "請先填寫跳過原因。", confirmed: "已確認。等待智能體繼續……" },
  en: { title: "PPT workbench", runtime: "Runtime", pipeline: "Pipeline", pages: "Pages", exports: "Exports",
    setup: "Install", refresh: "Refresh", load: "Load", projectPh: "projects/<name>_<date> project dir (absolute path)",
    emptyPages: "Load a project to preview svg_output pages", noExports: "No exports yet",
    confirmSection: "Design confirmation", stage1: "Stage-1 · Communication contract & template", stage2: "Stage-2 · Final design direction (pick one)",
    confirm: "Confirm", quick: "Quick mode (skip confirmation)", reason: "Reason (required to waive)",
    needReason: "Please enter a waive reason first.", confirmed: "Confirmed. Waiting for the agent to continue…" },
  de: { title: "PPT-Werkbank", runtime: "Laufzeit", pipeline: "Pipeline", pages: "Seiten", exports: "Exporte",
    setup: "Installieren", refresh: "Aktualisieren", load: "Laden", projectPh: "projects/<name>_<date> Projektordner (absolut)",
    emptyPages: "Projekt laden, um svg_output-Seiten anzuzeigen", noExports: "Noch keine Exporte",
    confirmSection: "Designbestätigung", stage1: "Stage-1 · Kommunikationsvertrag & Vorlage", stage2: "Stage-2 · Finale designrichtung (eine wählen)",
    confirm: "Bestätigen", quick: "Schnellmodus (Überspringen)", reason: "Grund (erforderlich)",
    needReason: "Bitte zuerst einen Grund eingeben.", confirmed: "Bestätigt. Warten auf den Agenten…" },
  es: { title: "Mesa de trabajo PPT", runtime: "Tiempo de ejecución", pipeline: "Flujo", pages: "Páginas", exports: "Exportaciones",
    setup: "Instalar", refresh: "Actualizar", load: "Cargar", projectPh: "projects/<name>_<date> carpeta del proyecto (absoluta)",
    emptyPages: "Cargue un proyecto para prever las páginas svg_output", noExports: "Aún no hay exportaciones",
    confirmSection: "Confirmación de diseño", stage1: "Stage-1 · Contrato de comunicación y plantilla", stage2: "Stage-2 · Dirección final de diseño (elige una)",
    confirm: "Confirmar", quick: "Modo rápido (omitir)", reason: "Motivo (obligatorio)",
    needReason: "Introduzca primero un motivo.", confirmed: "Confirmado. Esperando al agente…" },
  fr: { title: "Atelier PPT", runtime: "Exécution", pipeline: "Pipeline", pages: "Pages", exports: "Exports",
    setup: "Installer", refresh: "Actualiser", load: "Charger", projectPh: "projects/<name>_<date> dossier du projet (absolu)",
    emptyPages: "Chargez un projet pour prévisualiser les pages svg_output", noExports: "Aucun export pour l'instant",
    confirmSection: "Confirmation du design", stage1: "Stage-1 · Contrat de communication et modèle", stage2: "Stage-2 · Direction de design finale (choisir une)",
    confirm: "Confirmer", quick: "Mode rapide (ignorer)", reason: "Motif (obligatoire)",
    needReason: "Veuillez d'abord saisir un motif.", confirmed: "Confirmé. En attente de l'agent…" },
  ko: { title: "PPT 작업대", runtime: "런타임", pipeline: "파이프라인", pages: "페이지", exports: "내보내기",
    setup: "설치", refresh: "새로 고침", load: "불러오기", projectPh: "projects/<name>_<date> 프로젝트 디렉터리(절대 경로)",
    emptyPages: "프로젝트를 불러오면 svg_output 페이지가 표시됩니다", noExports: "아직 내보내기가 없습니다",
    confirmSection: "디자인 확인", stage1: "Stage-1 · 커뮤니케이션 계약 및 템플릿", stage2: "Stage-2 · 최종 디자인 방향(하나 선택)",
    confirm: "확인", quick: "빠른 모드(건너뛰기)", reason: "사유(필수)",
    needReason: "먼저 사유를 입력해 주세요.", confirmed: "확인되었습니다. 에이전트를 기다리는 중…" },
  tr: { title: "PPT çalışma tezgahı", runtime: "Çalışma zamanı", pipeline: "Hatt", pages: "Sayfalar", exports: "Dışa aktarmalar",
    setup: "Kur", refresh: "Yenile", load: "Yükle", projectPh: "projects/<name>_<date> proje dizini (mutlak)",
    emptyPages: "svg_output sayfalarını görmek için proje yükleyin", noExports: "Henüz dışa aktarma yok",
    confirmSection: "Tasarım onayı", stage1: "Stage-1 · İletişim sözleşmesi ve şablon", stage2: "Stage-2 · Nihai tasarım yönü (birini seçin)",
    confirm: "Onayla", quick: "Hızlı mod (atla)", reason: "Gerekçe (zorunlu)",
    needReason: "Lütfen önce bir gerekçe girin.", confirmed: "Onaylandı. Ajan bekleniyor…" },
};
function pickLocale() {
  const raw = (navigator.language || "zh-CN").toLowerCase();
  if (raw.startsWith("zh")) return raw.includes("tw") || raw.includes("hk") || raw.includes("hant") ? "zh-TW" : "zh-CN";
  for (const code of ["de", "es", "fr", "ko", "tr", "en"]) if (raw.startsWith(code)) return code;
  return "en";
}
const t = T[pickLocale()];
for (const [id, key] of [
  ["t-title", "title"], ["t-runtime", "runtime"], ["t-pipeline", "pipeline"],
  ["t-pages", "pages"], ["t-exports", "exports"], ["btn-setup", "setup"],
  ["btn-refresh", "refresh"], ["btn-load", "load"],
]) document.getElementById(id).textContent = t[key];
document.getElementById("project-dir").placeholder = t.projectPh;
document.getElementById("preview-empty").textContent = t.emptyPages;
// `t-noexports` is (re)created by loadProject inside #exports, so it is absent
// on first paint — a hard null deref here killed the whole init script and
// left every button listener unattached.
document.getElementById("t-noexports")?.append(document.createTextNode(t.noExports));

let projectDir = "";
let pages = []; // { name, bytes, dir }
let pageIndex = 0;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bytes = (n) => (n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.ceil(n / 1024)} KB`);

async function refreshRuntime() {
  const { runtime } = await bridge.invoke("ppt.runtimeStatus");
  const badge = document.getElementById("rt-stage");
  badge.textContent = runtime.stage;
  badge.className = `badge ${runtime.stage}`;
  document.getElementById("rt-diag").textContent = runtime.diag ?? "";
  document.getElementById("btn-setup").disabled = runtime.stage === "ready";
}

async function refreshJobs() {
  const { jobs } = await bridge.invoke("ppt.jobStatus");
  const active = (jobs ?? []).find((j) => j.status === "running");
  if (active) {
    document.getElementById("btn-setup").disabled = true;
    document.getElementById("rt-diag").textContent = `${active.id}: ${active.status} — ${(active.logTail ?? []).slice(-1)[0] ?? ""}`;
    setTimeout(refreshJobs, 2000);
  } else {
    await refreshRuntime();
  }
}

async function loadProject() {
  projectDir = document.getElementById("project-dir").value.trim();
  if (!projectDir) return;
  const data = await bridge.invoke("ppt.getState", { projectDir });
  if (data.error) return;
  renderPipeline(data.state);
  pages = [
    ...(data.listings?.svgPages ?? []).map((p) => ({ ...p, dir: "svg_output" })),
    ...(data.listings?.svgFinal ?? []).map((p) => ({ ...p, dir: "svg_final" })),
  ];
  pageIndex = 0;
  document.getElementById("pager").classList.toggle("hidden", pages.length === 0);
  if (pages.length === 0) {
    document.getElementById("preview-empty").textContent = "svg_output 暂无页面 / no pages yet";
  } else {
    await showPage();
  }
  renderOutline();
  renderBackups(data);
  const exports = document.getElementById("exports");
  exports.classList.remove("hidden");
  const files = data.listings?.exports ?? [];
  exports.innerHTML = files.length
    ? files.map((f) =>
        `<div class="f"><span>${esc(f.name)}</span><span class="row"><span class="muted">${bytes(f.bytes)}</span>` +
        `<span class="linkish" data-open="${esc(projectDir + "/exports")}">打开 / open</span></span></div>`).join("")
    : `<span class="muted" id="t-noexports">暂无导出 / no exports yet</span>`;
}

function renderOutline() {
  const list = document.getElementById("page-list");
  list.classList.remove("muted");
  list.innerHTML = pages
    .filter((pg) => pg.dir === "svg_output")
    .map(
      (pg, i) =>
        `<div class="page-item${i === pageIndex ? " sel" : ""}" data-page="${esc(pg.name)}">` +
        `<span>${esc(pg.name.replace(/\.svg$/, ""))}</span>` +
        `<span class="acts">` +
        `<button title="重生成此页" data-act="regenerate" data-page="${esc(pg.name)}">↻</button>` +
        `<button title="删除此页（入 backup）" data-act="delete" data-page="${esc(pg.name)}">✕</button>` +
        `<button title="重命名（NN_ 前缀即页序）" data-act="rename" data-page="${esc(pg.name)}">✎</button>` +
        `</span></div>`,
    )
    .join("");
}

function renderBackups(data) {
  const el = document.getElementById("backups");
  const backups = data.listings?.backups ?? [];
  el.classList.toggle("hidden", backups.length === 0);
  el.innerHTML = backups.length
    ? `<div class="muted">backup/（页操作历史，可恢复）：</div>` +
      backups.map((name) => `<div class="f"><span>${esc(name)}</span><span class="linkish" data-open="${esc(projectDir + "/backup/" + name)}">打开 / open</span></div>`).join("")
    : "";
}

document.getElementById("page-list").addEventListener("click", async (event) => {
  const act = event.target.closest("[data-act]");
  const item = event.target.closest(".page-item");
  if (act) {
    event.stopPropagation();
    const page = act.dataset.page;
    let target = null;
    if (act.dataset.act === "rename") {
      const input = window.prompt("新页名（含 NN_ 前缀与 .svg，如 02_new_status.svg）:", page);
      if (!input) return;
      target = input;
    }
    const result = await bridge.invoke("ppt.pageAction", { projectDir, page, action: act.dataset.act, target });
    if (result && result.error) { document.getElementById("preview-empty").textContent = result.error; return; }
    await loadProject();
    return;
  }
  if (item) {
    const name = item.dataset.page;
    const idx = pages.findIndex((pg) => pg.dir === "svg_output" && pg.name === name);
    if (idx >= 0) { pageIndex = idx; showPage(); }
  }
});

function renderPipeline(state) {
  const el = document.getElementById("pipeline");
  el.classList.remove("hidden");
  el.innerHTML = Object.entries(state.stages ?? {})
    .map(([name, s]) =>
      `<div class="stage"><span class="name">${esc(name)}</span>` +
      `<span class="badge ${esc(s.status)}">${esc(s.status)}${s.waiveReason ? ` · ${esc(s.waiveReason)}` : ""}</span>` +
      `${s.confirmedAt ? `<span class="muted">${esc(s.confirmedAt)}</span>` : ""}</div>`)
    .join("");
}

async function showPage() {
  const page = pages[pageIndex];
  document.getElementById("pg-label").textContent = `${pageIndex + 1} / ${pages.length}`;
  document.getElementById("pg-placeholder").textContent = page.name + (page.bytes ? ` · ${bytes(page.bytes)}` : "");
  const { svg, error } = await bridge.invoke("ppt.readSvg", { path: `${projectDir}/${page.dir}/${page.name}` });
  const preview = document.getElementById("preview");
  if (error || !svg) {
    preview.innerHTML = `<span class="muted">${esc(error ?? "empty")}</span>`;
    return;
  }
  preview.innerHTML = svg;
}

document.getElementById("btn-refresh").addEventListener("click", refreshRuntime);
document.getElementById("btn-setup").addEventListener("click", async () => {
  document.getElementById("btn-setup").disabled = true;
  await bridge.invoke("ppt.setup");
  refreshJobs();
});
document.getElementById("btn-load").addEventListener("click", loadProject);
document.getElementById("pg-prev").addEventListener("click", () => { if (pages.length) { pageIndex = (pageIndex - 1 + pages.length) % pages.length; showPage(); } });
document.getElementById("pg-next").addEventListener("click", () => { if (pages.length) { pageIndex = (pageIndex + 1) % pages.length; showPage(); } });
document.addEventListener("keydown", (event) => {
  if (event.target.tagName === "INPUT") return;
  if (event.key === "ArrowLeft") document.getElementById("pg-prev").click();
  if (event.key === "ArrowRight") document.getElementById("pg-next").click();
});
document.getElementById("exports").addEventListener("click", (event) => {
  const target = event.target.closest("[data-open]");
  if (target) bridge.invoke("ppt.openPath", { path: target.dataset.open });
});

// ───────────── Stage confirmation (replaces the popup confirm card) ─────────
// The agent submits Stage-1/Stage-2 recommendations; the pending decision is
// rendered here at the bottom of the workbench (workbench on top, decision
// below). Polling is the transport because an openPanel on a docked view is
// not a thing — and a poll also survives the panel being closed and reopened.

document.getElementById("t-confirm-section").textContent = t.confirmSection;
document.getElementById("btn-confirm-stage").textContent = t.confirm;
document.getElementById("btn-waive-stage").textContent = t.quick;
document.getElementById("confirm-reason").placeholder = t.reason;

let renderedConfirmKey = null;
let confirmBusy = false;

function kvLines(obj) {
  if (obj === null || obj === undefined) return "";
  if (typeof obj !== "object") {
    return `<div class="keyline"><span class="k"></span><span>${esc(obj)}</span></div>`;
  }
  if (Array.isArray(obj)) {
    return obj
      .map((item, i) => {
        const label = item && typeof item === "object" && !Array.isArray(item)
          ? esc(item.name ?? item.title ?? item.label ?? `#${i + 1}`)
          : `#${i + 1}`;
        const inner = item && typeof item === "object" && !Array.isArray(item)
          ? kvLines(item)
          : `<div class="keyline"><span class="k"></span><span>${esc(item)}</span></div>`;
        return `<div class="confirm-subcard"><b>${label}</b>${inner}</div>`;
      })
      .join("");
  }
  return Object.entries(obj)
    .filter(([, v]) => v !== null && v !== undefined)
    .map(([k, v]) => {
      if (typeof v === "object") {
        const keys = Object.keys(v);
        if (keys.length === 1 && (keys[0] === "value" || keys[0] === "text") && typeof v[keys[0]] !== "object") {
          return `<div class="keyline"><span class="k">${esc(k)}</span><span>${esc(v[keys[0]])}</span></div>`;
        }
        return `<div class="confirm-subcard"><b>${esc(k)}</b>${kvLines(v)}</div>`;
      }
      return `<div class="keyline"><span class="k">${esc(k)}</span><span>${esc(v)}</span></div>`;
    })
    .join("");
}

function showConfirmError(message) {
  const box = document.getElementById("confirm-error");
  box.textContent = message;
  box.classList.remove("hidden");
}

function hideConfirmSection() {
  renderedConfirmKey = null;
  document.getElementById("confirm-section").classList.add("hidden");
  document.getElementById("t-confirm-section").classList.add("hidden");
}

async function submitConfirm(waive) {
  if (confirmBusy || !renderedConfirmKey) return;
  const reasonInput = document.getElementById("confirm-reason");
  const reason = reasonInput.value.trim();
  if (waive && !reason) {
    showConfirmError(t.needReason);
    reasonInput.classList.remove("hidden");
    return;
  }
  confirmBusy = true;
  const [projectDir, stage] = renderedConfirmKey.split("::");
  const btnConfirm = document.getElementById("btn-confirm-stage");
  const btnWaive = document.getElementById("btn-waive-stage");
  btnConfirm.disabled = true;
  btnWaive.disabled = true;
  document.getElementById("confirm-error").classList.add("hidden");
  try {
    const result = await bridge.invoke("ppt.confirmStage", {
      projectDir, stage, waive, waiveReason: reason || null,
    });
    if (result && result.error) {
      showConfirmError(String(result.error));
    } else {
      const body = document.getElementById("confirm-body");
      body.innerHTML = `<p class="muted">${esc(t.confirmed)}</p>`;
      document.getElementById("confirm-reason").classList.add("hidden");
      // The pipeline listing may now show the newly confirmed gate.
      if (projectDir === document.getElementById("project-dir").value.trim()) void loadProject();
      setTimeout(() => { hideConfirmSection(); }, 4000);
    }
  } catch (error) {
    showConfirmError(String(error?.message ?? error));
  } finally {
    confirmBusy = false;
    btnConfirm.disabled = false;
    btnWaive.disabled = false;
  }
}

async function pollPendingConfirm() {
  if (confirmBusy) return;
  let boot;
  try {
    boot = await bridge.invoke("ppt.getBootstrap");
  } catch {
    return; // bridge busy; the next tick retries
  }
  const pending = boot?.pending ?? null;
  const key = pending ? `${pending.projectDir}::${pending.stage}` : null;
  if (key === renderedConfirmKey) return;
  renderedConfirmKey = key;
  const section = document.getElementById("confirm-section");
  const heading = document.getElementById("t-confirm-section");
  if (!pending) {
    section.classList.add("hidden");
    heading.classList.add("hidden");
    return;
  }
  heading.classList.remove("hidden");
  section.classList.remove("hidden");
  document.getElementById("confirm-reason").classList.add("hidden");
  document.getElementById("confirm-error").classList.add("hidden");
  const parts = [`<div class="confirm-stage-head">${esc(pending.stage === "stage1" ? t.stage1 : t.stage2)}</div>`];
  parts.push(`<div class="muted">${esc(pending.projectDir)}</div>`);
  try {
    const data = await bridge.invoke("ppt.getState", { projectDir: pending.projectDir });
    const rec = data?.recommendations?.[pending.stage];
    if (rec) {
      if (pending.stage === "stage2") {
        const directions = rec.directions ?? rec.options ?? [];
        parts.push(directions.map((d, i) =>
          `<div class="confirm-subcard"><b>${esc(i === 0 ? `★ ${d.name ?? d.title ?? "#" + (i + 1)}` : d.name ?? d.title ?? "#" + (i + 1))}</b>${kvLines(d)}</div>`).join(""));
      } else {
        parts.push(`<div>${kvLines(rec)}</div>`);
      }
      parts.push(`<details><summary class="muted">raw</summary><pre>${esc(JSON.stringify(rec, null, 2))}</pre></details>`);
    } else {
      parts.push(`<pre>${esc(JSON.stringify(pending, null, 2))}</pre>`);
    }
  } catch {
    parts.push(`<pre>${esc(JSON.stringify(pending, null, 2))}</pre>`);
  }
  document.getElementById("confirm-body").innerHTML = parts.join("");
}

document.getElementById("btn-confirm-stage").addEventListener("click", () => submitConfirm(false));
document.getElementById("btn-waive-stage").addEventListener("click", () => submitConfirm(true));
setInterval(pollPendingConfirm, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) void pollPendingConfirm(); });
void pollPendingConfirm();

refreshRuntime();
</script>
</body>
