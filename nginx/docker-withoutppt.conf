# ─────────────────────────────────────────────────────────────
# Labo-Flow — NGINX reverse proxy (Docker production mode, no AIPPT)
#
# Used by the docker-nginx container for docker-compose-withoutppt.yml.
# Upstreams use Docker service names instead of 127.0.0.1 ports.
#
# Service → container internal port:
#   clawith-frontend  :3000   (nginx serving React build)
#   clawith-backend   :8000   (uvicorn FastAPI)
#   frontend          :80     (WeKnora nginx serving Vue build)
# ─────────────────────────────────────────────────────────────

worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile        on;
    keepalive_timeout  65;

    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    client_max_body_size 500M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserve X-Forwarded-Proto from upstream reverse proxy (Lucky, NPM, etc.).
    # When the upstream terminates TLS and connects to nginx via plain HTTP,
    # nginx sees $scheme = http, but the external client used https.
    map $http_x_forwarded_proto $proxy_scheme {
        default $scheme;
        https   https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream clawith_frontend { server clawith-frontend:3000; }
    upstream clawith_backend  { server clawith-backend:8000; }

    server {
        listen 80;
        server_name  localhost;

        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://clawith_backend;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /ws {
            proxy_pass http://clawith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 86400;
        }

        location /kb/ {
            set $weknora frontend:80;
            rewrite ^/kb/(.*)$ /$1 break;
            proxy_pass http://$weknora$uri$is_args$args;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /kb {
            return 301 /kb/;
        }

        location = /ppt {
            return 404;
        }
        location /ppt/ {
            return 404;
        }

        location / {
            proxy_pass http://clawith_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}