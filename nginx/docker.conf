# ─────────────────────────────────────────────────────────────
# Labo-Flow — NGINX reverse proxy (Docker production mode)
#
# Used by the docker-nginx container (mounted at /etc/nginx/nginx.conf).
# Upstreams use Docker service names instead of 127.0.0.1 ports.
#
# Service → container internal port:
#   clawith-frontend  :3000   (nginx serving React build)
#   clawith-backend   :8000   (uvicorn FastAPI)
#   frontend          :80     (WeKnora nginx serving Vue build)
#   aippt             :80     (nginx serving Vue build)
# ─────────────────────────────────────────────────────────────

worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile        on;
    keepalive_timeout  65;

    # Proxy timeouts — LLM calls and streaming can be slow
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Client upload size (knowledge base uploads)
    client_max_body_size 500M;

    # Docker internal DNS resolver — required so that proxy_pass with
    # variables defers resolution to request time instead of startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserve X-Forwarded-Proto from upstream reverse proxy (Lucky, NPM, etc.).
    # When the upstream terminates TLS and connects to nginx via plain HTTP,
    # nginx sees $scheme = http, but the external client used https.
    map $http_x_forwarded_proto $proxy_scheme {
        default $scheme;
        https   https;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams (Docker service names) ────────────────────
    upstream clawith_frontend { server clawith-frontend:3000; }
    upstream clawith_backend  { server clawith-backend:8000; }
    # weknora and aippt use direct proxy_pass (no upstream) so nginx
    # starts even when those containers are temporarily unavailable;
    # DNS is resolved at request time, not at startup.

    server {
        listen 80;
        server_name  localhost;

        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # ── Clawith backend API ─────────────────────────────
        location /api/ {
            proxy_pass http://clawith_backend;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── Clawith backend WebSocket ───────────────────────
        location /ws {
            proxy_pass http://clawith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 86400;
        }

        # ── WeKnora (/kb/* → weknora-frontend:80) ────────────
        # Strips /kb/ prefix before forwarding. WeKnora frontend
        # is built with VITE_BASE_URL=/kb/ so all asset and
        # router paths are under /kb/.
        location /kb/ {
            set $weknora frontend:80;
            rewrite ^/kb/(.*)$ /$1 break;
            proxy_pass http://$weknora$uri$is_args$args;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /kb {
            return 301 /kb/;
        }

        # ── AIPPT API proxy → Clawith backend ──────────────
        location /ppt/api/ {
            rewrite ^/ppt/api/(.*)$ /api/$1 break;
            proxy_pass http://clawith_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
        }

        # ── AIPPT (/ppt → aippt:80) ─────────────────────────
        location /ppt/ {
            set $aippt_svc aippt:80;
            proxy_pass http://$aippt_svc;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
        location = /ppt {
            return 301 /ppt/;
        }

        # ── Clawith frontend (root + SPA fallback) ──────────
        location / {
            proxy_pass http://clawith_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
