# ─────────────────────────────────────────────────────────────
# Labo-Flow — NGINX reverse proxy (dev mode)
#
# Unified entry on port 3008:
#   /        → Clawith frontend (Vite dev server on 3080)
#   /api     → Clawith backend (FastAPI on 8008)
#   /ws      → Clawith backend WebSocket
#   /kb/     → WeKnora (Docker service on 8800)
#   /ppt/    → Pro Slides daemon (Express on :7456, serves backend + static frontend)
#   /ppt-master/ → PPT-Master webui (Vite on :5990); /ppt-master/api → worker (:5991)
#
# Run with:  nginx -p $PWD -c nginx.conf -g 'daemon off;'
# ─────────────────────────────────────────────────────────────

worker_processes  1;
error_log  .data/log/nginx-error.log warn;
pid        .data/pid/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Try Homebrew path first, fallback to system path
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  .data/log/nginx-access.log;
    sendfile        on;
    keepalive_timeout  65;

    # Proxy timeouts — LLM calls and streaming can be slow
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Client upload size (knowledge base uploads)
    client_max_body_size 500M;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams ───────────────────────────────────────────
    upstream clawith_frontend { server 127.0.0.1:3080; }
    upstream clawith_backend  { server 127.0.0.1:8008; }
    upstream weknora          { server 127.0.0.1:8800; }
    upstream pro_slides       { server 127.0.0.1:7456; }
    upstream pptmaster_worker { server 127.0.0.1:5991; }
    upstream pptmaster_webui  { server 127.0.0.1:5990; }

    server {
        listen 3008;
        server_name  localhost;

        # ── Clawith backend API ─────────────────────────────
        location /api/ {
            proxy_pass http://clawith_backend;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── Clawith backend WebSocket ───────────────────────
        location /ws {
            proxy_pass http://clawith_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 86400;
        }

        # ── WeKnora (/kb/* → weknora:8800) ──────────────────
        # WeKnora frontend is built with VITE_BASE_URL=/kb/ so
        # all asset paths and router navigation are under /kb/.
        # Strip /kb/ prefix before forwarding.
        location /kb/ {
            # DO NOT strip /kb/ prefix — WeKnora Vite dev server runs with
            # base=/kb/ and expects all paths under /kb/.
            proxy_pass http://weknora;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /kb {
            return 301 /kb/;
        }

        # ── Pro Slides API: strip /ppt prefix → daemon /api/ routes ──
    location /ppt/api/ {
            proxy_pass http://pro_slides/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
        location = /ppt/api {
            return 301 /ppt/api/;
        }

        # ── Pro Slides static assets: pass through with /ppt/ prefix ──
        # express.static maps /ppt/xxx to out/ppt/xxx on disk.
        location /ppt/ {
            proxy_pass http://pro_slides;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
        location = /ppt {
            return 301 /ppt/;
        }

        # ── PPT-Master API (/ppt-master/api/ → worker /api/) ──
        location /ppt-master/api/ {
            rewrite ^/ppt-master/api/(.*)$ /api/$1 break;
            proxy_pass http://pptmaster_worker;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ── PPT-Master WebSocket ──
        location /ppt-master/ws {
            rewrite ^/ppt-master/ws(.*)$ /ws$1 break;
            proxy_pass http://pptmaster_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 86400;
        }

        # ── PPT-Master SSO entry ──
        location /ppt-master/sso {
            rewrite ^/ppt-master/sso(.*)$ /sso$1 break;
            proxy_pass http://pptmaster_worker;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── PPT-Master share links ──
        location /ppt-master/share/ {
            rewrite ^/ppt-master/share/(.*)$ /share/$1 break;
            proxy_pass http://pptmaster_worker;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── PPT-Master SPA (Vite dev server with base=/ppt-master/) ──
        # Vite dev mode honors the `base` config — assets are served under
        # /ppt-master/ already, so no rewrite needed.
        location /ppt-master/ {
            proxy_pass http://pptmaster_webui;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location = /ppt-master {
            return 301 /ppt-master/;
        }

        # ── Clawith frontend (root + SPA fallback) ──────────
        location / {
            proxy_pass http://clawith_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
