worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # WebSocket upgrade map
    # ---------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------------------
    # Rate limiting — protect auth endpoints from brute-force
    # 10 req/s per IP; burst of 20, no delay on burst
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ---------------------------------------------------------------------------
    # Upstreams
    # ---------------------------------------------------------------------------
    upstream pptmaster_worker { server worker:8000; }
    upstream pptmaster_webui  { server webui:80; }

    # ---------------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # HTTPS — main server block
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        # TLS — certs mounted from host at /opt/pptmaster/certs/
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS — drop SSLv3/TLS 1.0/1.1
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Allow large PPTX uploads and source document imports
        client_max_body_size 200m;

        # ---------------------------------------------------------------------------
        # Health check alias — /api/health maps to worker /health
        # Placed before /api/ to take priority (exact match)
        # ---------------------------------------------------------------------------
        location = /api/health {
            proxy_pass http://pptmaster_worker/health;
            access_log off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # Auth endpoints — rate limited
        # ---------------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://pptmaster_worker;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # API (all other routes)
        # ---------------------------------------------------------------------------
        location /api/ {
            proxy_pass http://pptmaster_worker;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Share links (served by worker, no auth required)
        location /share/ {
            proxy_pass http://pptmaster_worker;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # WebSocket — long-lived session streams
        # ---------------------------------------------------------------------------
        location /ws {
            proxy_pass http://pptmaster_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            # Keep WS connections alive for up to 24 h (active generation sessions)
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # ---------------------------------------------------------------------------
        # Frontend SPA — catch-all
        # ---------------------------------------------------------------------------
        location / {
            proxy_pass http://pptmaster_webui;
            proxy_set_header Host $host;
        }
    }
}
